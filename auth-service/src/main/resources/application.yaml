spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5433/tinyurl_auth
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  api:
    base-path: ${API_BASE_PATH:/api/v1}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-for-auth-service-32chars}
    expiration: ${JWT_EXPIRATION:PT1H}
