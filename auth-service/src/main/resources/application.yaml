spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5433/tinyurl_auth
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true

server:
  port: 8082

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9002}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

app:
  api:
    base-path: ${API_BASE_PATH:/api/v1}
  jwt:
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
    expiration: ${JWT_EXPIRATION:PT1H}
  refresh-token:
    expiration: ${REFRESH_TOKEN_EXPIRATION:P30D}
