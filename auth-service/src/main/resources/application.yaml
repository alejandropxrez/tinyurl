spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5433/tinyurl_auth
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info