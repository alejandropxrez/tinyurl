spring:
  application:
    name: url-service
  datasource:
    url: jdbc:postgresql://localhost:5432/tinyurl_urls
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  base-url: ${APP_BASE_URL:http://localhost:8081}
  api:
    base-path: ${API_BASE_PATH:/api/v1}
  snowflake:
    node-id: ${SNOWFLAKE_NODE_ID:1}
  events:
    clicks:
      exchange: ${CLICK_EVENTS_EXCHANGE:tinyurl.clicks}
      routing-key: ${CLICK_EVENTS_ROUTING_KEY:click.recorded}
