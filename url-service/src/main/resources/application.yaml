spring:
  application:
    name: url-service
  datasource:
    url: jdbc:postgresql://localhost:5432/tinyurl_urls
    username: ${POSTGRES_URLS_USER}
    password: ${POSTGRES_URLS_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:2s}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_COMMAND_TIMEOUT:500ms}

server:
  port: 8081

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9001}
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    instances:
      rabbitClickEvents:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
      redisRedirectCache:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
      redisCreateUrlRateLimiter:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
  retry:
    instances:
      rabbitClickEvents:
        max-attempts: 3
        wait-duration: 100ms
app:
  base-url: ${APP_BASE_URL:http://localhost:8081}
  api:
    base-path: ${API_BASE_PATH:/api/v1}
  jwt:
    public-key: ${JWT_PUBLIC_KEY}
  snowflake:
    node-id: ${SNOWFLAKE_NODE_ID:1}
    node-id-offset: ${SNOWFLAKE_NODE_ID_OFFSET:1}
    derive-node-id-from-hostname: ${SNOWFLAKE_DERIVE_NODE_ID_FROM_HOSTNAME:false}
  events:
    clicks:
      exchange: ${CLICK_EVENTS_EXCHANGE:tinyurl.clicks}
      routing-key: ${CLICK_EVENTS_ROUTING_KEY:click.recorded}
  cache:
    redirects:
      ttl: ${REDIRECT_CACHE_TTL:10m}
  rate-limits:
    create-url:
      limit: ${CREATE_URL_RATE_LIMIT:60}
      window: ${CREATE_URL_RATE_LIMIT_WINDOW:1m}
