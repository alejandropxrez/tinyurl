services:
  postgres-urls:
    image: postgres:17-alpine
    container_name: tinyurl-postgres-urls
    environment:
      POSTGRES_DB: tinyurl_urls
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_urls_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-auth:
    image: postgres:17-alpine
    container_name: tinyurl-postgres-auth
    environment:
      POSTGRES_DB: tinyurl_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-analytics:
    image: postgres:17-alpine
    container_name: tinyurl-postgres-analytics
    environment:
      POSTGRES_DB: tinyurl_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_analytics_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: tinyurl-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: tinyurl-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  url-service:
    build:
      context: ./url-service
    container_name: tinyurl-url-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-urls:5432/tinyurl_urls
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_BASE_URL: http://localhost:8081
      SNOWFLAKE_NODE_ID: 1
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    ports:
      - "8081:8081"
    depends_on:
      postgres-urls:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics-service:
    build:
      context: ./analytics-service
    container_name: tinyurl-analytics-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-analytics:5432/tinyurl_analytics
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    ports:
      - "8083:8083"
    depends_on:
      postgres-analytics:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  auth-service:
    build:
      context: ./auth-service
    container_name: tinyurl-auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/tinyurl_auth
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    ports:
      - "8082:8082"
    depends_on:
      postgres-auth:
        condition: service_healthy

volumes:
  postgres_urls_data:
  postgres_auth_data:
  postgres_analytics_data:
