apiVersion: v1
kind: Secret
metadata:
  name: postgres-urls-secret
  namespace: tinyurl
type: Opaque
stringData:
  database: tinyurl_urls
  username: postgres
  password: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-urls-data
  namespace: tinyurl
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-urls
  namespace: tinyurl
  labels:
    app: postgres-urls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-urls
  template:
    metadata:
      labels:
        app: postgres-urls
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-urls-secret
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-urls-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-urls-secret
                  key: password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-urls-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-urls
  namespace: tinyurl
spec:
  selector:
    app: postgres-urls
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
